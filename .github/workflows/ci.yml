name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          files=$(git ls-files | grep -E '\.sh$|\.bash$|^bin/(crouter|crouter-compat)$')
          if [ -n "$files" ]; then
            # SC1007:  CDPATH= cd / VAR= VAR2= one-liner resets are intentional POSIX idioms
            # SC1090/SC1091: providers and config are sourced at runtime (dynamic paths)
            # SC2034: provider vars are read by the launcher after sourcing, not in-file
            # shellcheck disable=SC2086
            shellcheck --exclude=SC1007,SC1090,SC1091,SC2034 $files
          else
            echo "No shell scripts found to check."
          fi

      - name: Check Node syntax
        run: |
          for file in bin/gateway bin/keypool-proxy lib/*.js; do
            node --check "$file"
          done

      - name: Run all offline tests with sh and dash
        run: |
          for shell in sh dash; do
            for test_file in test/*.sh; do
              "$shell" "$test_file"
            done
          done

      - name: Verify release metadata
        run: |
          version=$(cat VERSION)
          test "$(./bin/crouter --version)" = "crouter $version"
          grep -F "version-$version-blue" README.md
          grep -F "## [$version]" CHANGELOG.md
